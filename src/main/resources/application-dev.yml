server:
  port: 20480

spring:
  config:
    activate:
      on-profile: dev
  data:
    redis:
      host: kimd0.iptime.org
      port: 26379

database:
  datasource:
    pub:
      master:
        url: jdbc:mysql://kimd0.iptime.org:23306/STOCK_SERVICE?zeroDateTimeBehavior=convertToNull&useLegacyDatetimeCode=false&serverTimezone=Asia/Seoul&noAccessToProcedureBodies=true&useSSL=false&allowPublicKeyRetrieval=true&connectTimeout=5000&socketTimeout=30000&tcpKeepAlive=true
        username: root
        password: 1234
        driver-class-name: com.mysql.cj.jdbc.Driver
        configure:
          pool-name: stock-back-master-pool
          maximum-pool-size: 8
          minimum-idle: 1
          connection-timeout: 30000
          validation-timeout: 5000
          idle-timeout: 240000
          max-lifetime: 300000
          keepalive-time: 30000
      slave1:
        url: jdbc:mysql://kimd0.iptime.org:23306/STOCK_SERVICE?zeroDateTimeBehavior=convertToNull&useLegacyDatetimeCode=false&serverTimezone=Asia/Seoul&noAccessToProcedureBodies=true&useSSL=false&allowPublicKeyRetrieval=true&connectTimeout=5000&socketTimeout=30000&tcpKeepAlive=true
        username: root
        password: 1234
        driver-class-name: com.mysql.cj.jdbc.Driver
        configure:
          pool-name: stock-back-slave-pool
          maximum-pool-size: 8
          minimum-idle: 1
          connection-timeout: 30000
          validation-timeout: 5000
          idle-timeout: 240000
          max-lifetime: 300000
          keepalive-time: 30000
