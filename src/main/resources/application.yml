spring:
  application:
    name: stock-back-service
  profiles:
    active: local-direct
    group:
      local: local
      local-direct:
        - local
      test: test
      dev: dev
      prod: prod
  devtools:
    livereload:
      enabled: false
    restart:
      enabled: false
  cloud:
    discovery:
      enabled: true
    openfeign:
      client:
        config:
          default:
            connectTimeout: 5000
            readTimeout: 5000
            loggerLevel: basic
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        jdbc:
          batch_size: 20
          fetch_size: 50
  jdbc:
    template:
      query-timeout: ${STOCK_JDBC_QUERY_TIMEOUT:30s}
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    serialization:
      FAIL_ON_EMPTY_BEANS: false
  data:
    jpa:
      repositories:
        enabled: false
    redis:
      host: localhost
      port: 6379

database:
  jpa:
    hibernate:
      ddl-auto: validate

stock:
  simulation-clock:
    base-date: ${STOCK_SIMULATION_BASE_DATE:}
    real-seconds-per-day: ${STOCK_SIMULATION_REAL_SECONDS_PER_DAY:7200}
    stale-after-seconds: ${STOCK_SIMULATION_STALE_AFTER_SECONDS:30}
  market-session:
    open-time: ${STOCK_MARKET_SESSION_OPEN_TIME:06:00}
    close-time: ${STOCK_MARKET_SESSION_CLOSE_TIME:18:00}
  market:
    price-stream:
      redis-listener-enabled: ${STOCK_PRICE_STREAM_REDIS_LISTENER_ENABLED:true}
      executor:
        core-size: ${STOCK_PRICE_STREAM_EXECUTOR_CORE_SIZE:1}
        max-size: ${STOCK_PRICE_STREAM_EXECUTOR_MAX_SIZE:2}
        queue-capacity: ${STOCK_PRICE_STREAM_EXECUTOR_QUEUE_CAPACITY:1000}
  trading:
    opening-grant-amount: ${STOCK_OPENING_GRANT_AMOUNT:10000000}

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
    registerWithEureka: true
    fetchRegistry: true
  instance:
    preferIpAddress: true
    hostname: localhost

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,info
      base-path: /actuator
  endpoint:
    health:
      show-details: always
