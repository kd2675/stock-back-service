server:
  port: 30480

spring:
  config:
    activate:
      on-profile: test
  cloud:
    discovery:
      enabled: false
  test:
    database:
      replace: any
  data:
    redis:
      repositories:
        enabled: false

eureka:
  client:
    enabled: false
    registerWithEureka: false
    fetchRegistry: false

stock:
  market:
    price-stream:
      redis-listener-enabled: false

database:
  datasource:
    pub:
      master:
        url: jdbc:h2:mem:stock_service_testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false
        driver-class-name: org.h2.Driver
        username: sa
        password:
        configure:
          pool-name: stock-back-master-test-pool
          maximum-pool-size: 4
          minimum-idle: 1
          connection-timeout: 30000
          validation-timeout: 5000
          idle-timeout: 240000
          max-lifetime: 300000
          keepalive-time: 120000
      slave1:
        url: jdbc:h2:mem:stock_service_testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false
        driver-class-name: org.h2.Driver
        username: sa
        password:
        configure:
          pool-name: stock-back-slave-test-pool
          maximum-pool-size: 4
          minimum-idle: 1
          connection-timeout: 30000
          validation-timeout: 5000
          idle-timeout: 240000
          max-lifetime: 300000
          keepalive-time: 120000
  jpa:
    hibernate:
      ddl-auto: create-drop
