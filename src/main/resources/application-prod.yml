server:
  port: 10480

spring:
  config:
    activate:
      on-profile: prod
  data:
    redis:
      host: ${STOCK_REDIS_HOST}
      port: ${STOCK_REDIS_PORT}

database:
  datasource:
    pub:
      master:
        url: "${STOCK_DB_URL}?zeroDateTimeBehavior=convertToNull&useLegacyDatetimeCode=false&serverTimezone=Asia/Seoul&noAccessToProcedureBodies=true&useSSL=false&allowPublicKeyRetrieval=true&connectTimeout=5000&socketTimeout=30000&tcpKeepAlive=true"
        username: ${STOCK_DB_USERNAME}
        password: ${STOCK_DB_PASSWORD}
        driver-class-name: com.mysql.cj.jdbc.Driver
        configure:
          pool-name: ${STOCK_DB_POOL_NAME:stock-back-master-pool}
          maximum-pool-size: ${STOCK_DB_MAX_POOL_SIZE:8}
          minimum-idle: ${STOCK_DB_MINIMUM_IDLE:1}
          connection-timeout: ${STOCK_DB_CONNECTION_TIMEOUT:30000}
          validation-timeout: ${STOCK_DB_VALIDATION_TIMEOUT:5000}
          idle-timeout: ${STOCK_DB_IDLE_TIMEOUT:240000}
          max-lifetime: ${STOCK_DB_MAX_LIFETIME:300000}
          keepalive-time: ${STOCK_DB_KEEPALIVE_TIME:120000}
      slave1:
        url: "${STOCK_DB_SLAVE_URL:${STOCK_DB_URL}}?zeroDateTimeBehavior=convertToNull&useLegacyDatetimeCode=false&serverTimezone=Asia/Seoul&noAccessToProcedureBodies=true&useSSL=false&allowPublicKeyRetrieval=true&connectTimeout=5000&socketTimeout=30000&tcpKeepAlive=true"
        username: ${STOCK_DB_SLAVE_USERNAME:${STOCK_DB_USERNAME}}
        password: ${STOCK_DB_SLAVE_PASSWORD:${STOCK_DB_PASSWORD}}
        driver-class-name: com.mysql.cj.jdbc.Driver
        configure:
          pool-name: ${STOCK_DB_SLAVE_POOL_NAME:stock-back-slave-pool}
          maximum-pool-size: ${STOCK_DB_SLAVE_MAX_POOL_SIZE:${STOCK_DB_MAX_POOL_SIZE:8}}
          minimum-idle: ${STOCK_DB_SLAVE_MINIMUM_IDLE:${STOCK_DB_MINIMUM_IDLE:1}}
          connection-timeout: ${STOCK_DB_SLAVE_CONNECTION_TIMEOUT:${STOCK_DB_CONNECTION_TIMEOUT:30000}}
          validation-timeout: ${STOCK_DB_SLAVE_VALIDATION_TIMEOUT:${STOCK_DB_VALIDATION_TIMEOUT:5000}}
          idle-timeout: ${STOCK_DB_SLAVE_IDLE_TIMEOUT:${STOCK_DB_IDLE_TIMEOUT:240000}}
          max-lifetime: ${STOCK_DB_SLAVE_MAX_LIFETIME:${STOCK_DB_MAX_LIFETIME:300000}}
          keepalive-time: ${STOCK_DB_SLAVE_KEEPALIVE_TIME:${STOCK_DB_KEEPALIVE_TIME:120000}}

stock:
  batch-client:
    base-url: ${STOCK_BATCH_API_BASE_URL}
    internal-token: ${STOCK_BATCH_INTERNAL_TOKEN}
